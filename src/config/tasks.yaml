meta_data_extraction:
  description: >
    提取上传图片中的行政处罚案卷封面元数据。

    【提取范围】

    仅提取当前案卷封面上实际出现并且能够辨认的内容。
    不得从案卷目录、行政处罚决定书、立案审批表或其他页面补充信息。
    不得根据案件名称、案号格式、执法机关所在地或一般经验推测缺失内容。

    【固定输出字段】

    以下字段必须全部出现在输出JSON中：

    1. 执法单位
       指封面载明的行政执法机关、立卷单位、全宗名称或者办案机关。
       “行政执法主体”“执法机关”“立卷单位”等同类标签可以归入此字段。

    2. 案卷名称
       指封面载明的案件名称、案卷题名或具体案件标题。
       不要仅将“行政处罚案卷”这一通用文书标题识别为案卷名称；
       只有封面没有具体案件标题，且明确将其作为案卷名称填写时才提取。

    3. 案号
       指封面明确标注为“案号”“案件编号”等的编号。
       不得将归档号、档号或者其他文书文号误识别为案号。
       如果封面未写字段标签，但编号的位置和版式能够明确证明其为本案案号，
       可以提取；无法确定时返回null。

    4. 案由
       提取封面“案由”字段对应的原文。
       不得根据案卷名称自行概括或者生成案由。

    5. 当事人
       提取封面载明的自然人姓名、法人名称或者其他组织名称。
       多个当事人按照封面原有顺序合并为一个字符串，不得遗漏“等”字。

    6. 立案日期
       仅在封面明确载明立案日期时提取。

    7. 结案日期
       仅在封面明确载明结案日期时提取。

    8. 处理结果
       仅提取封面明确载明的处罚结果、案件处理结果或者结案结果。

    9. 保管期限
       提取“永久”“长期”“30年”“10年”等封面原文。

    10. 卷号
        提取“第几卷”“共几卷第几卷”等信息。

    11. 页数
        提取封面记载的本卷总页数，仅返回字段值，不自行添加单位。

    12. 归档号
        仅提取明确标注为“归档号”的内容。

    13. 档号
        仅提取明确标注为“档号”的内容，不得与案号、归档号混淆。

    14. 立卷人
        提取封面明确载明的立卷人员姓名。

    15. 审核人
        提取封面明确载明的审核人员姓名。

    【额外字段】

    除上述固定字段外，封面中其他具有明确“字段名称—字段值”关系的信息，
    全部放入“额外字段”对象中，例如：

    - 案件来源
    - 收案日期
    - 归档日期
    - 承办机构
    - 承办人
    - 卷别
    - 正卷或副卷
    - 分类号
    - 密级
    - 年度
    - 全宗号
    - 目录号
    - 本卷附光盘数量
    - 封面中其他实际存在的字段

    “额外字段”中的键应尽量保留封面原始字段名称，不要擅自改写。
    已经归入固定字段的信息不得在“额外字段”中重复输出。
    装饰性标题、说明性文字、制表机关名称和无法确定对应值的零散文字，
    不作为额外字段。

    【提取规则】

    1. 所有内容必须来自封面实际可见文字，不得推测、补写或纠正事实。
    2. 固定字段无内容、未填写、被遮挡或无法可靠辨认时，返回null。
    3. 不得使用空字符串、斜杠、“无”“未知”“未提供”等代替null，
       除非这些文字就是封面实际填写的字段值。
    4. 保留名称、案号和案由中的原始文字、数字及符号。
    5. 可以删除字段值首尾多余空格，并将因排版产生的无意义换行合并。
    6. 不得擅自修改错别字、案号格式、机构名称或者日期。
    7. 日期完整且格式明确时，统一输出为YYYY-MM-DD；
       日期不完整或存在歧义时，保留封面原文。
    8. 印章中的文字只有在清晰可辨且属于字段值时才可以提取。
    9. 同一额外字段在封面出现多个不同值时，将值输出为字符串数组。
    10. 只输出一个合法JSON对象，不得输出分析过程、解释、Markdown标记或代码块。

  expected_output: >
    严格按照以下结构返回合法JSON：

    {
      "执法单位": null,
      "案卷名称": null,
      "案号": null,
      "案由": null,
      "当事人": null,
      "立案日期": null,
      "结案日期": null,
      "处理结果": null,
      "保管期限": null,
      "卷号": null,
      "页数": null,
      "归档号": null,
      "档号": null,
      "立卷人": null,
      "审核人": null,
      "额外字段": {}
    }

    输出要求：

    - 固定字段一个都不能缺少。
    - 固定字段的值只能是字符串或null。
    - “额外字段”必须是JSON对象。
    - 额外字段的值只能是字符串、字符串数组或null。
    - 未发现额外字段时返回空对象{}。
    - 不得增加“提取说明”“置信度”“原始文本”等未定义的顶层字段。
    - 不要使用```json或其他Markdown格式包裹结果。

  agent: meta_data_extractor
  output_file: results/meta_data_extraction.json

#鲁棒性，针对一些错误的处理？
dir_identification:
  description: >
    判断上传的文档是否是文书档案的目录，如果是目录，提取其中的结构化信息。
    识别任务：图片如上，流程如下：
    1.首先判断给定图片是否是文书档案目录，如果不是目录，直接返回{{"is_dir": false, "dir_info": []}}，
    2.如果是目录，提取目录中的结构化信息，识别图片顶部的表头，将每一列的名称作为列表内字典对象中的 Key，例如，如果表头是“顺序号”，“题名”，”页号“，“备注”，则字典格式应为 {{"顺序号": "...", "题名": "...", “页号”:, "备注": "..."}}。 返回{{"is_dir": true, "dir_info": [dict]}}，其中dir_info包含目录的结构化信息。
    3.页号统一置为-1 。
  expected_output: >
    dir_info中的字典对象应当至少包含以下Key：顺序号，题名，页号，顺序号和题名和页号是必填项，如果目录中没有顺序号，应当自己依序设置顺序号。顺序号，题名，页号统一命名为“section_id”，“section_name”，“section_page”。
    严格将结果以json形式返回，不要添加任何其他内容，不需要诸如'''json{content} ``` 包裹，样例：
    样例1：
    {"is_dir": True, "dir_info": [
      {"section_id": "1", "section_name": "行政处罚决定书", "section_page": -1, "备注": "原件"},
      {"section_id": "2", "section_name": "送达回执", "section_page": -1, "备注": "复印件"}
    ]}
    样例2：
    {"is_dir": false, "dir_info": []}
  agent: dir_identifier
  output_file: results/dir_identification.json

section_identification:
  description: >
    以下是卷宗目录的相邻一行或两行信息：\n{section_info}\n ，根据给定的目录信息（section1,section2）和一张(picture1)或两张(picture1,picture2)文书图片，判断给定的图片是否属于对应文书，识别流程如下：
    1.判断第一张图片picture1是否属于提供的section（section1或者section2）
    2.判断第二张图片picture2是否属于提供的section（section1或者section2）
    图片编号依顺序给出
  expected_output: >
    对于所有给定的图片结果以字典"{"picture1": section_id1(int), "picture2": section_id2(int)}"返回，section_id代表图片归属的文书，如果是section1则为1，如果是section2则为2，如果图片不属于任何其中某个文书则为-1，
    注意：section_id的值一定是int类型的数字且返回的字典键值需要严格按照顺序，"picture1"需要在"picture2"之前，
    严格将结果以json格式返回，不要添加任何其他内容，不需要诸如'''json{content} ``` 包裹，
    输出示例：
    {"picture1": 1, "picture2": 1}
    {"picture1": 2, "picture2": -1}
    {"picture1": -1}
    {"picture1": 2}
  agent: section_identifier
  output_file: results/section_identifier.json

document_review:
  description: >
    根据给定的审查标准，审查事项以及给定的分数区间和评分项类型，对行政卷宗进行规范性审查，最后需要给出：意见内容和评分。
    以下是以下是案卷元信息:\n{meta_info}\n文书的目录信息\n{dir_info}\n，以下是审查要求\n{rule_info}\n。
    审查流程如下：
    1.对于每一个审查事项，根据给定的审查标准，制定审查计划 plan。
    2.根据目录信息，使用多模态模型工具call_vlm执行任务，函数接收参数(section_id: int, task: str) -> str, 其中section_id是一个数字，对应目录中文书的编号，task是一个字符串，表示需要执行的审查任务，函数会根据section_id对应文书图片，将图片和任务描述task调用多模态模型。task是你需要获取的信息，根据你的plan逐步构建task。最后返回结果字符串。
    3.工具调用边界：优先只查看审查要求中“对应文书”明确关联的文书；如果目录中没有完全同名文书，可以查看最接近的同类文书。不要为了旁证反复核查无关文书；已经能判断时必须停止调用工具。
    4.如果对应文书不存在、材料不足、图片不可读或工具调用失败，直接给出低置信度结论，不要继续反复调用工具。
    5.如果由于工具调用失败或者材料不足等其他意外无法得出审查意见，以及对于该规则审查置信度较低，返回的confidence值需要置为"low"，表示本次审查置信度低，需要人工复查。
    6.综合所有审查事项综合审查意见，并给出评分，分值以及评分项类型已在审查要求给出。
    7.最终答案只能输出一个 JSON 对象；禁止输出审查过程、标题、Markdown、```json 代码块、解释文字或任何 JSON 之外的内容。
  expected_output: >
    如果是工具调用，按照工具说明即可，如果是最终结果：
    严格将结果以json格式返回，不要添加任何其他内容，结果格式如下：{"comment": List[Dict], "score": float, "confidence": Literal["high", "medium", "low"]}，comment是一个字典列表，每个字典包含以下Key："section_id":List[int]（一个数字列表对应目录中文书的编号），"content"（审查意见内容），score为卷宗的审查分值，confidence为本次审查置信度，如果该文书在此规则审查下没有问题，则comment字段应为空列表。
    最终输出必须是可被 json.loads 直接解析的原始 JSON。不要使用 Markdown 代码块，不要在 JSON 前后添加任何说明文字。
    输出示例：
    {"comment": [{"section_id": [1], "content": "法律法规摘要中《行政处罚法》第七十三条引用的最后一款“行政机关批准延期、分期缴纳罚款的，申请人民法院强制执行的期限，自暂缓或者分期缴纳罚款期限结束之日起计算。”为第七十二条的内容，建议修改"},
    {"section_id": [5, 8], "content": "整改复查意见书针对的系8167号责令整改指令书，与责令整改指令书不一致，建议修改"}
    ], "score": 100.0, "confidence": "high"}
  agent: document_reviewer
  output_file: results/document_review.json

result_write:
  description: >
    根据给定的模型的最后一次对话，提取出json格式的真正的审查结果，如果没有预期格式的内容片段，直接返回空字典
    模型的最后一次回复如下:\n{last_response}
  expected_output: >  
    严格将结果以json格式返回，不要添加任何其他内容，结果格式如下：{"comment": List[Dict], "score": float, "confidence": Literal["high", "medium", "low"]}，comment是一个字典列表，每个字典包含以下Key："section_id":List[int]（一个数字列表对应目录中文书的编号），"content"（审查意见内容），score为卷宗的审查分值，confidence为本次审查置信度，如果该文书在此规则审查下没有问题，则comment字段应为空列表。
    在解析json的时候注意字符串：外部统一使用双引号，内部统一使用单引号，严禁引号嵌套字符串导致解析错误
    错误示例：
    "content": "送达回执中"受送达人"一栏..." 错误，多引号嵌套
    正确示例：
    "content": "送达回执中'受送达人'一栏..." 正确，外部双引号内部单引号
    最终输出必须是可被 json.loads 直接解析的原始 JSON。不要使用 Markdown 代码块，不要在 JSON 前后添加任何说明文字。
    输出示例：
    {"comment": [{"section_id": [1], "content": "法律法规摘要中《行政处罚法》第七十三条引用的最后一款“行政机关批准延期、分期缴纳罚款的，申请人民法院强制执行的期限，自暂缓或者分期缴纳罚款期限结束之日起计算。”为第七十二条的内容，建议修改"},
    {"section_id": [5, 8], "content": "整改复查意见书针对的系8167号责令整改指令书，与责令整改指令书不一致，建议修改"}
    ], "score": 100.0, "confidence": "high"}
  agent: result_writer