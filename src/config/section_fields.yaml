    eng_name: "case_handler_opinion"
    type: "str"
    notes: "建议立案/建议不予立案"
  承办人具体意见:
    eng_name: "case_handler_opinion_basis"
    type: "str"
    notes: "具体意见"
  承办人信息:
    eng_name: "case_handler_info"
    type: "list[dict]"
    notes: "承办人信息数组，格式：[{'cert_no':'xxx','name':'xxx','sign_time':'yyyy-mm-dd HH:MM:SS'}]"
  承办机构信息:
    eng_name: "case_handle_agency_info"
    type: "dict"
    notes: >-
      "opinion"选项【"拟同意立案"、"拟不同意立案？"】。格式示例：
      {"opinion":"拟同意立案","sign_time":"yyyy-mm-dd HH:MM:SS","sign_value":""}
  审批信息:
    eng_name: "case_approval_info"
    type: "dict"
    notes: >-
      "opinion"选项【"同意立案"、"不同意立案"】。格式示例：
      {"opinion":"同意立案","sign_time":"yyyy-mm-dd HH:MM:SS","sign_value":""}


